<html>
    <head>
        <title>LISTS</title>
    </head>


    <body>
        <header><h1>IMPLEMENTATION OF LIST TAG</h1></header>
        <main><b>There are two types of list we can use in HTML which are ordered and unordered lists.</b></main>
        <br>
        <h2><b>Below are my favourite Sports</b></h2>
        <ol>
            <li type="1">Football</li>
            <li type="i">Volleyball</li>
            <li type="a">Badminton</li>
            <li type="A">Cricket</li>
        </ol>
        <br>
        <hr>
        <br>
        <h2><b>My favourite Video Games</b></h2>
        <ul>
            <li type="circle">Minecraft</li>
            <li type="square">Efootball(PES)</li>
            <li type="radio">FC 27</li>
            <li type="disc">FIFA 15</li>
        </ul>
        <br>
        <hr>
        <br>
    </body>
</html>
