
<html>
	<head>
		<title>FORM</title>
	</head>
	
	


	<body>
		<h2>Please fill the form given below</h2>
		<hr>

		<form>
			        <div><b>Name:</b><input type="text" name="username" placeholder="enter username"></div>
		    <br>
	
			        <div><b>Password:</b><input type="password" placeholder="enter your password"></div>
		    <br>
		
			        <div><b>Email:</b><input type="email" name="email" placeholder="someone@example.com"></div>
		    <br>
	
			        <div><b>Address:</b> <input type ="text" name="Address" placeholder="Your Address" ></div>
		    <br>
		      
			        <div><b>Contact:</b> <input type="number" name="contact" placeholder="contact"></div>
		    <br>
		
  			       <div><b>About:</b> <input type="textarea" name="message" value=""></div>
		    <br>

                    <div>
			            <h2><b>Select Your Gender</b></h2> 
			            Male <input type="radio" value="Male">
			            Others <input type="radio" value="Others">
                    </div>
		    <hr>


			        <div>Submit: <button>Submit</button></div>
         </form>   

	</body>
</html>
